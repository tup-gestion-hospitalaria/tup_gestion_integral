$kind: http-request
name: 07 PATCH versión obsoleta (409)
method: PATCH
url: '{{base_url}}/api/v1/patients/{{patient_id}}'
order: 7700
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "active": false,
      "version": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('409 conflicto de versión', function () {
        pm.response.to.have.status(409);
      });
