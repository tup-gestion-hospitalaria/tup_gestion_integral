$kind: http-request
method: GET
url: '{{base_url}}/api/v1/users'
order: 3400
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 lista usuarios', function () {
        pm.response.to.have.status(200);
      });
      pm.test('array de usuarios', function () {
        const users = pm.response.json();
        pm.expect(users).to.be.an('array');
        pm.expect(users.length).to.be.at.least(2);
      });
