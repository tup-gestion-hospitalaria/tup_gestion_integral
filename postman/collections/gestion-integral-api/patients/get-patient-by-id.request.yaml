$kind: http-request
method: GET
url: '{{base_url}}/api/v1/patients/{{seed_patient_id}}'
order: 4300
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{user_id_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 paciente fixture', function () {
        pm.response.to.have.status(200);
      });
      pm.test('id coincide', function () {
        pm.expect(pm.response.json().id).to.eql(pm.environment.get('seed_patient_id'));
      });
