<div
  class="confirm-dialog"
  role="alertdialog"
  [attr.aria-labelledby]="'confirm-dialog-title'"
  [attr.aria-describedby]="'confirm-dialog-message'"
>
  <h2 id="confirm-dialog-title">{{ data.titleKey | translate: data.titleParams }}</h2>

  <p id="confirm-dialog-message">{{ data.messageKey | translate: data.messageParams }}</p>

  <div class="confirm-dialog-actions">
    <button type="button" mat-button cdkFocusInitial (click)="cancel()">
      {{ data.cancelKey ?? 'COMMON.CANCEL' | translate }}
    </button>

    <button
      type="button"
      mat-flat-button
      [color]="data.danger ? 'warn' : 'primary'"
      (click)="confirm()"
    >
      {{ data.confirmKey ?? 'COMMON.CONFIRM' | translate }}
    </button>
  </div>
</div>
