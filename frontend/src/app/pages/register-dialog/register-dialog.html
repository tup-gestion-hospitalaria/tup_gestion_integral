<h2 id="register-dialog-title">{{ 'REGISTER.TITLE' | translate }}</h2>

<div
  class="register-form"
  role="form"
  aria-labelledby="register-dialog-title"
  (keydown.enter)="$event.stopPropagation()"
>
  <div class="field">
    <label class="field-label" for="register-display-name">{{
      'REGISTER.DISPLAY_NAME' | translate
    }}</label>
    <input
      id="register-display-name"
      type="text"
      [placeholder]="'REGISTER.DISPLAY_NAME' | translate"
      autocomplete="name"
      [(ngModel)]="displayName"
      class="register-input"
    />
  </div>

  <div class="field">
    <label class="field-label" for="register-photo">{{ 'REGISTER.PHOTO_URL' | translate }}</label>
    <input
      id="register-photo"
      type="url"
      [placeholder]="'REGISTER.PHOTO_URL' | translate"
      autocomplete="photo"
      [(ngModel)]="photoURL"
      class="register-input"
    />
  </div>

  <div class="field">
    <label class="field-label" for="register-email">{{ 'REGISTER.EMAIL' | translate }}</label>
    <input
      id="register-email"
      type="email"
      [placeholder]="'REGISTER.EMAIL' | translate"
      autocomplete="email"
      [(ngModel)]="email"
      class="register-input"
    />
  </div>

  <div class="field">
    <label class="field-label" for="register-password">{{ 'REGISTER.PASSWORD' | translate }}</label>
    <input
      id="register-password"
      type="password"
      [placeholder]="'REGISTER.PASSWORD' | translate"
      autocomplete="new-password"
      [(ngModel)]="password"
      class="register-input"
    />
  </div>

  <div class="field">
    <label class="field-label" for="register-confirm-password">{{
      'REGISTER.CONFIRM_PASSWORD' | translate
    }}</label>
    <input
      id="register-confirm-password"
      type="password"
      [placeholder]="'REGISTER.CONFIRM_PASSWORD' | translate"
      autocomplete="new-password"
      [(ngModel)]="confirmPassword"
      class="register-input"
      [attr.aria-invalid]="errorMessageKey ? true : null"
      [attr.aria-describedby]="errorMessageKey ? 'register-error' : null"
    />
  </div>

  <p class="error-message" *ngIf="errorMessageKey" id="register-error" role="alert">
    {{ errorMessageKey | translate }}
  </p>
</div>

<div class="dialog-actions">
  <button mat-button type="button" (click)="cancel()">
    {{ 'COMMON.CANCEL' | translate }}
  </button>

  <button mat-raised-button color="primary" type="button" (click)="createAccount()">
    {{ 'REGISTER.SUBMIT' | translate }}
  </button>
</div>
