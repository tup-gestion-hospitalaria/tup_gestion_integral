<div class="login-page">
  <section class="login-brand">
    <div class="brand-content">
      <img src="/logo-proyect.png" alt="Logo Gestión Hospitalaria" class="brand-logo" />

      <h1>{{ 'APP.TITLE' | translate }}</h1>

      <p>
        {{ 'LOGIN.SUBTITLE' | translate }}
      </p>
    </div>
  </section>

  <section class="login-panel">
    <form class="login-card" (ngSubmit)="loginWithEmail()">
      <button
        mat-stroked-button
        type="button"
        class="google-button"
        (click)="loginWithGoogle()"
        [disabled]="loading"
      >
        <span class="button-content">
          <img src="/google-icon.png" alt="" class="google-icon" />

          <span *ngIf="!loading">
            {{ 'LOGIN.GOOGLE' | translate }}
          </span>

          <mat-spinner *ngIf="loading" diameter="20" strokeWidth="3"></mat-spinner>
        </span>
      </button>

      <div class="divider" aria-hidden="true">
        <span></span>

        <p>{{ 'LOGIN.OR' | translate }}</p>

        <span></span>
      </div>

      <label class="input-group">
        <span class="input-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
            <path
              fill="currentColor"
              d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
            />
          </svg>
        </span>

        <input
          type="email"
          name="email"
          [placeholder]="'LOGIN.EMAIL' | translate"
          autocomplete="email"
          [(ngModel)]="email"
          class="login-input"
        />
      </label>

      <label class="input-group">
        <span class="input-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
            <path
              fill="currentColor"
              d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"
            />
          </svg>
        </span>

        <input
          type="password"
          name="password"
          [placeholder]="'LOGIN.PASSWORD' | translate"
          autocomplete="current-password"
          [(ngModel)]="password"
          class="login-input"
        />
      </label>

      <button mat-flat-button type="submit" class="email-button" [disabled]="loading">
        <span class="button-content">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
              <path
                fill="currentColor"
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </span>

          <span *ngIf="!loading">
            {{ 'LOGIN.EMAIL_LOGIN' | translate }}
          </span>

          <mat-spinner *ngIf="loading" diameter="20" strokeWidth="3"></mat-spinner>
        </span>
      </button>

      <button
        mat-button
        type="button"
        class="register-button"
        (click)="registerWithEmail()"
        [disabled]="loading"
      >
        <span class="button-content">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
              <path
                fill="currentColor"
                d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </span>

          {{ 'LOGIN.REGISTER' | translate }}
        </span>
      </button>
    </form>
  </section>
</div>
